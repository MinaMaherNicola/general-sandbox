services:
  elasticsearch1:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0-amd64
    container_name: elasticsearch1
    ports:
      - '9200:9200'
      - '9300:9300'
    environment:
      - node.name=node-1
      - cluster.name=my-cluster
      - discovery.seed_hosts=elasticsearch1
      - cluster.initial_master_nodes=node-1
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - network.host=0.0.0.0
    volumes:
      - es-data1:/usr/share/elasticsearch/data
    healthcheck:
      test: curl --fail http://localhost:9200/_cluster/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.0-amd64
    container_name: kibana
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch1:9200
      - SERVER_HOST=0.0.0.0
    volumes:
      - kibana-config:/usr/share/kibana/config
    depends_on:
      elasticsearch1:
        condition: service_healthy

volumes:
  es-data1:
  kibana-config:
